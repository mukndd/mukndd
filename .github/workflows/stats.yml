name: refresh live stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # STATS_TOKEN: read-only fine-grained PAT (Contents, Actions, Metadata) on the
      # private project repos. Without it the public repo still refreshes and the
      # private cards turn amber and keep their last verified values.
      # STATS_REPOS: JSON map of project id -> "owner/repo", kept out of this public repo.
      - name: refresh stats
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_REPOS: ${{ secrets.STATS_REPOS }}
        run: node scripts/update-stats.mjs

      - name: commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats README.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(stats): refresh live project stats [skip ci]"
          git push
