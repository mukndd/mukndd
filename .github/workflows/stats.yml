name: refresh live stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # POSTHOG_API_KEY: a read-only personal API key (query:read) for the PostHog
      # project. Without it the audience cards keep their last value, turn into a
      # dated "snapshot" after a day, and this step fails; Flyweight still refreshes
      # from its README.
      - name: refresh stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: node scripts/update-stats.mjs

      # always(): keep committing kept values and fresh Flyweight data even when
      # the refresh step failed, so the run is red but the cards stay consistent.
      - name: commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats README.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(stats): refresh live project stats [skip ci]"
          git push
